{% extends "base.html" %}
{% block title %}{{ profile.name }} — Забери.РФ{% endblock %}
{% block content %}
<div class="wrap">
    <div class="card" style="max-width:480px;">
        <div class="donor-row">
            {% set av = profile.avatar_path or '' %}
            {% if av %}
                <img class="avatar" src="{{ av }}" alt="" style="width:80px;height:80px;">
            {% else %}
                <img class="avatar" src="https://placehold.co/160x160?text=?" alt="" style="width:80px;height:80px;">
            {% endif %}
            <div>
                <h2 style="margin:0;">{{ profile.name }}</h2>
                <p class="muted small">Контакты и личные данные скрыты.</p>
            </div>
        </div>
        <p><a href="{{ url_for('index') }}">← На главную</a></p>
    </div>
</div>
{% endblock %}
